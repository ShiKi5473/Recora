name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 版本號或 Tag（例如 1.0.1 或 v1.0.1；留空則只編譯上傳 Workflow Artifact，不建立 Release）'
        required: false
        default: ''
        type: string
      prerelease:
        description: '標記為 Pre-release（預先發行版，App 自動更新不會安裝）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::請先在 Repository Secrets 設定 KEYSTORE_BASE64（或 ANDROID_KEYSTORE_BASE64），以確保每次發佈的 APK 簽章一致（Android 覆蓋更新必須使用相同簽章）。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > app/mufu-debug.keystore
          PASS="${KEYSTORE_PASSWORD:-android}"
          keytool -list -keystore app/mufu-debug.keystore -storepass "$PASS" > /dev/null

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="v${INPUT_TAG#v}"
          else
            TAG=""
          fi

          if [ -n "$TAG" ]; then
            VERSION_NAME="${TAG#v}"
            CORE="${VERSION_NAME%%-*}"
            CORE="${CORE%%+*}"
            if [[ "$CORE" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[4]:-0}"
              VERSION_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))
              if [ "$VERSION_CODE" -lt 1 ]; then VERSION_CODE=1; fi
            else
              echo "::error::版本號格式不正確（需為 X.Y 或 X.Y.Z）：$VERSION_NAME"
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
            echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
            echo "apk_name=Recora-${TAG}.apk" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version_name=" >> "$GITHUB_OUTPUT"
            echo "version_code=" >> "$GITHUB_OUTPUT"
            echo "apk_name=Recora-build-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests and build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          GRADLE_ARGS=(:app:testDebugUnitTest :app:assembleRelease)
          if [ -n "${{ steps.version.outputs.version_code }}" ]; then
            GRADLE_ARGS+=(-PversionCode="${{ steps.version.outputs.version_code }}")
            GRADLE_ARGS+=(-PversionName="${{ steps.version.outputs.version_name }}")
          fi
          ./gradlew "${GRADLE_ARGS[@]}"

      - name: Package APK and checksum
        run: |
          mkdir -p release-assets
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::找不到簽署後的 Release APK：$APK_SRC"
            exit 1
          fi
          cp "$APK_SRC" "release-assets/${{ steps.version.outputs.apk_name }}"
          (cd release-assets && sha256sum "${{ steps.version.outputs.apk_name }}" > "${{ steps.version.outputs.apk_name }}.sha256")

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "release-assets/${{ steps.version.outputs.apk_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: release-assets/*
          retention-days: 30

      - name: Create GitHub Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Recora ${{ steps.version.outputs.tag }}
          prerelease: ${{ inputs.prerelease || contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
          files: release-assets/*

      - name: Clean up keystore
        if: always()
        run: rm -f app/mufu-debug.keystore
